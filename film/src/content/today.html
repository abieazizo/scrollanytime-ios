<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: FRL; src: url(/assets/fonts/FrankRuhlLibre-700.ttf); font-weight: 700; }
  @font-face { font-family: FRL; src: url(/assets/fonts/FrankRuhlLibre-500.ttf); font-weight: 500; }
  @font-face { font-family: Inter; src: url(/assets/fonts/Inter-500.ttf); font-weight: 500; }
  @font-face { font-family: Inter; src: url(/assets/fonts/Inter-600.ttf); font-weight: 600; }
  :root { --bg:#0B0B0F; --surface:#14141B; --text:#F5F2EA; --gold:#C9A24B; --glow:#E3C87A; }
  html, body { margin:0; width:1179px; height:2556px; background:var(--bg); overflow:hidden; color:var(--text); }
  .status { position:absolute; top:52px; left:0; right:0; height:60px; font:600 50px Inter; }
  .status .time { position:absolute; left:120px; top:0; }
  .status .ind { position:absolute; right:110px; top:10px; display:flex; gap:14px; align-items:flex-end; }
  .bar { width:10px; background:var(--text); border-radius:3px; }
  .batt { width:76px; height:36px; border:4px solid rgba(245,242,234,.5); border-radius:11px; position:relative; margin-left:12px; }
  .batt::after { content:''; position:absolute; inset:4px; right:18px; background:var(--text); border-radius:5px; }
  h1 { position:absolute; left:84px; top:230px; margin:0; font:700 104px FRL; letter-spacing:-1px; }
  .sub { position:absolute; left:88px; top:378px; font:500 44px Inter; color:rgba(245,242,234,.55); }
  .card { position:absolute; left:64px; right:64px; top:500px; height:1500px; border-radius:64px;
          background: radial-gradient(120% 70% at 50% 0%, #1d1c24 0%, var(--surface) 60%);
          box-shadow: inset 0 0 0 3px rgba(201,162,75,.45), 0 30px 90px rgba(0,0,0,.6); overflow:hidden; }
  .label { position:absolute; left:0; right:0; top:96px; text-align:center; font:600 42px Inter; letter-spacing:10px; color:var(--gold); }
  canvas { position:absolute; left:0; top:0; }
  .roll { position:absolute; left:0; right:0; top:1135px; height:200px; overflow:hidden; text-align:center; font:700 132px FRL; }
  .roll div { position:absolute; left:0; right:0; }
  .rule { position:absolute; left:50%; width:260px; margin-left:-130px; top:1335px; height:4px; background:var(--gold); border-radius:2px; }
  .note { position:absolute; left:40px; right:40px; top:1370px; text-align:center; font:600 54px/1.3 Inter; color:rgba(245,242,234,.85); }
  nav { position:absolute; left:0; right:0; bottom:0; height:250px; background:rgba(11,11,15,.96); border-top:2px solid rgba(255,255,255,.06); }
  nav .it { position:absolute; top:44px; width:220px; text-align:center; font:500 34px Inter; color:rgba(245,242,234,.55); }
  nav .it svg { display:block; margin:0 auto 12px; }
  nav .on { color:var(--gold); }
  .home { position:absolute; bottom:24px; left:50%; width:420px; margin-left:-210px; height:14px; border-radius:7px; background:rgba(245,242,234,.85); }
</style>
</head>
<body>
  <div class="status"><span class="time">7:42</span>
    <span class="ind"><span class="bar" style="height:14px"></span><span class="bar" style="height:22px"></span><span class="bar" style="height:30px"></span><span class="bar" style="height:38px"></span><span class="batt"></span></span></div>
  <h1>My Torah</h1>
  <div class="sub">Today’s seder · 3 clips · 6 minutes</div>
  <div class="card">
    <div class="label">TODAY</div>
    <canvas id="c" width="1051" height="1500"></canvas>
    <div class="roll"><div id="a">Day six</div><div id="b">Day seven</div></div>
    <div class="rule" id="rule"></div>
    <div class="note" id="note">Seven-day streak. Shabbos never breaks it.</div>
  </div>
  <nav>
    <div class="it" style="left:40px"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M10 9l5 3-5 3z" fill="currentColor"/></svg>Feed</div>
    <div class="it on" style="left:310px"><svg width="64" height="64" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 5.6L20 9l-4.4 3.8L17 19l-5-3-5 3 1.4-6.2L4 9l5.6-1.4z"/></svg>My Torah</div>
    <div class="it" style="left:580px"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.2c3 .2 5.5 2.6 5.5 5.8"/></svg>Rabbis</div>
    <div class="it" style="left:850px"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 21c0-4.1 3.4-7.4 7.5-7.4s7.5 3.3 7.5 7.4"/></svg>Profile</div>
    <div class="home"></div>
  </nav>
<script>
const P = new URLSearchParams(location.search);
const TL = JSON.parse(decodeURIComponent(P.get('tl')));
const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = cv.width, CX = W / 2, CY = 620, R = 330;
const clamp = (x) => Math.max(0, Math.min(1, x));
const eio = (x) => { x = clamp(x); return x * x * x * (x * (6 * x - 15) + 10); };
const eout = (x) => 1 - Math.pow(1 - clamp(x), 3);
function rnd(i) { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function flame(scale, flick, alpha) {
  g.save(); g.translate(CX, CY + 40); g.scale(scale, scale * (1 + flick * 0.04)); g.globalAlpha = alpha;
  const grad = g.createLinearGradient(0, -230, 0, 120);
  grad.addColorStop(0, '#FFF1C4'); grad.addColorStop(0.45, '#E3C87A'); grad.addColorStop(1, '#B9832C');
  g.shadowColor = 'rgba(227,200,122,0.9)'; g.shadowBlur = 80;
  g.fillStyle = grad; g.beginPath();
  g.moveTo(0, -240 - flick * 10);
  g.bezierCurveTo(70, -150, 150, -80, 140, 10);
  g.bezierCurveTo(130, 95, 70, 125, 0, 125);
  g.bezierCurveTo(-70, 125, -130, 95, -140, 10);
  g.bezierCurveTo(-150, -60, -90, -100, -60, -150);
  g.bezierCurveTo(-55, -95, -30, -70, -10, -70);
  g.bezierCurveTo(-25, -140, -10, -190, 0, -240 - flick * 10);
  g.fill();
  g.shadowBlur = 0; g.fillStyle = 'rgba(255,248,226,0.9)'; g.beginPath();
  g.moveTo(0, -40 - flick * 6); g.bezierCurveTo(45, 10, 62, 45, 50, 80); g.bezierCurveTo(40, 112, -40, 112, -50, 80); g.bezierCurveTo(-60, 45, -30, 10, 0, -40 - flick * 6); g.fill();
  g.restore();
}
window.render = (t) => {
  const h5 = TL.h5;
  g.clearRect(0, 0, W, cv.height);
  // ring track
  g.lineCap = 'round';
  g.strokeStyle = 'rgba(245,242,234,0.08)'; g.lineWidth = 46; g.beginPath(); g.arc(CX, CY, R, 0, Math.PI * 2); g.stroke();
  const p = eio((t - h5.ring[0]) / (h5.ring[1] - h5.ring[0]));
  if (p > 0) {
    const a0 = -Math.PI / 2, a1 = a0 + p * Math.PI * 2;
    g.save(); g.shadowColor = 'rgba(227,200,122,' + (0.55 + 0.4 * p) + ')'; g.shadowBlur = 40 + 50 * p;
    const gr = g.createLinearGradient(CX - R, CY - R, CX + R, CY + R);
    gr.addColorStop(0, '#E3C87A'); gr.addColorStop(1, '#C9A24B');
    g.strokeStyle = gr; g.lineWidth = 46; g.beginPath(); g.arc(CX, CY, R, a0, a1); g.stroke();
    // bright head
    g.fillStyle = '#FFF4D2'; g.shadowBlur = 60; g.beginPath(); g.arc(CX + R * Math.cos(a1), CY + R * Math.sin(a1), 20, 0, Math.PI * 2); g.fill();
    g.restore();
  }
  // flame
  const fu = t - h5.flame;
  if (fu < 0) {
    flame(0.92, 0, 0.13);                           // unlit outline-ish ghost
  } else {
    const s = fu < 0.18 ? eout(fu / 0.18) * 1.14 : 1.14 - 0.14 * eio((fu - 0.18) / 0.3);
    const flick = Math.sin(t * 23) * 0.5 + Math.sin(t * 37) * 0.5;
    flame(s * 0.92, flick, 1);
    // 20 gold particles
    for (let i = 0; i < h5.particles; i++) {
      const ang = (i / h5.particles) * Math.PI * 2 + rnd(i) * 0.5, sp = 380 + rnd(i + 9) * 340;
      const u = fu / (0.6 + rnd(i + 3) * 0.4);
      if (u > 1) continue;
      const d = eout(u) * sp, x = CX + Math.cos(ang) * d, y = CY + 20 + Math.sin(ang) * d - u * u * 80;
      g.save(); g.globalAlpha = (1 - u) * 0.95; g.fillStyle = '#F2D896'; g.shadowColor = '#E3C87A'; g.shadowBlur = 24;
      g.beginPath(); g.arc(x, y, 7 + 9 * (1 - u) * rnd(i + 5), 0, Math.PI * 2); g.fill(); g.restore();
    }
    // warm bloom behind the flame
    const bl = g.createRadialGradient(CX, CY, 0, CX, CY, R * 0.95);
    bl.addColorStop(0, 'rgba(227,200,122,' + (0.18 * Math.min(1, fu * 4)) + ')'); bl.addColorStop(1, 'rgba(227,200,122,0)');
    g.globalCompositeOperation = 'lighter'; g.fillStyle = bl; g.fillRect(0, 0, W, cv.height); g.globalCompositeOperation = 'source-over';
  }
  // Day six -> Day seven
  const r = eio((t - h5.day_roll) / 0.38);
  document.getElementById('a').style.transform = `translateY(${-r * 200}px)`;
  document.getElementById('a').style.opacity = 1 - r;
  document.getElementById('b').style.transform = `translateY(${(1 - r) * 200}px)`;
  document.getElementById('b').style.opacity = r;
  document.getElementById('b').style.color = r > 0.5 ? '#F5F2EA' : '#F5F2EA';
  const rule = document.getElementById('rule');
  rule.style.transform = `scaleX(${0.3 + 0.7 * r})`;
  rule.style.boxShadow = `0 0 ${30 * r}px rgba(227,200,122,${0.9 * r})`;
  document.getElementById('note').style.opacity = clamp((t - h5.day_roll - 0.25) / 0.3);
};
window.__ready = true;
</script>
</body>
</html>
