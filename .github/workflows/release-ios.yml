# Build, sign, upload and (optionally) submit the iOS app — WITHOUT a Mac.
#
# Everything a Mac was needed for happens on a GitHub-hosted macOS runner: it creates the signing
# certificate and the App Store provisioning profile against App Store Connect using an API key,
# archives ship/ios, exports an App Store IPA, uploads it, and pushes metadata + both screenshot
# sets. ship/mac-run.sh still works and is now optional.
#
# REQUIRED REPOSITORY SECRETS (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID          App Store Connect API key id            (10 chars, e.g. ABCD123456)
#   ASC_ISSUER_ID       the issuer id shown above the key list  (a UUID)
#   ASC_KEY_P8_BASE64   base64 of the downloaded AuthKey_*.p8   (base64 -i AuthKey_XXX.p8)
# The key needs the App Manager role: certificates, profiles, TestFlight and metadata all go
# through it. Nothing else is stored — no .p12, no keychain export, no Apple ID password.
#
# WHY fastlane's own actions and not `xcrun altool`: cert/sigh create the signing assets on the
# runner from the API key, so there is no certificate to move between machines and nothing to
# expire quietly in someone's keychain.
name: release-ios
# MIRROR: generated by ship/mirror-ios-public.sh from the private repository — do not edit here.

on:
  workflow_dispatch:
    inputs:
      submit_for_review:
        description: 'Submit to App Review after upload. Leave false until OWNER-DEVICE-TEST is logged.'
        type: boolean
        default: false
      skip_upload:
        description: 'Build and sign only — do not upload.'
        type: boolean
        default: false
      compile_only:
        description: 'Compile UNSIGNED and stop. Needs no Apple account — proves the code builds.'
        type: boolean
        default: false
      build_number:
        description: 'Build number (defaults to the run number).'
        type: string
        default: ''

concurrency:
  group: release-ios
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP_IDENTIFIER: com.scrollanytime.app
      SCHEME: pwa-shell
      # fastlane reads these directly; app_store_connect_api_key writes the key file from them.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    steps:
      - uses: actions/checkout@v5

      - name: The secrets must exist before anything slow runs
        if: ${{ !inputs.compile_only }}
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!v:-}" ]; then echo "::error::secret $v is not set"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          # A p8 that is not valid base64, or not a private key, fails here rather than 20 minutes in.
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > /tmp/asc.p8 2>/dev/null || { echo "::error::ASC_KEY_P8_BASE64 is not valid base64"; exit 1; }
          head -1 /tmp/asc.p8 | grep -q 'BEGIN PRIVATE KEY' || { echo "::error::the decoded key is not a PKCS#8 private key — upload the .p8 exactly as downloaded"; exit 1; }
          rm -f /tmp/asc.p8
          echo "secrets present and the key decodes"

      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          echo "SDKs:"; xcodebuild -showsdks | grep -i iphoneos || true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: fastlane
        run: gem install fastlane --no-document --version '~> 2.222'

      # The app wraps the LIVE site, so a binary built from a commit that is not deployed would
      # ship a shell around someone else's code. Same check ship/mac-run.sh makes.
      - name: The deployed site must be this commit
        run: |
          LIVE="$(curl -fsS --max-time 20 https://scrollanytime.com/version | sed -n 's/.*"sha":"\([^"]*\)".*/\1/p')"
          echo "live=$LIVE head=$GITHUB_SHA"
          if [ "$LIVE" = "unstamped" ] || [ -z "$LIVE" ]; then
            echo "::warning::/version is unstamped — cannot prove the deployed site matches this commit"
          elif [ "$LIVE" != "$GITHUB_SHA" ]; then
            echo "::warning::deployed sha $LIVE != this commit $GITHUB_SHA"
          else
            echo "deployed site matches this commit"
          fi

      - name: Lint the shell (plist whitelist, app-bound domains, icon alpha, launch screen)
        run: bash ship/ios-lint.sh

      # Proves the app COMPILES with no Apple account, no certificate and no profile. This is the
      # step that would have caught a shell that had never been built — which is exactly what this
      # one was until the Firebase removal.
      - name: Compile unsigned
        if: ${{ inputs.compile_only }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project ship/ios/pwa-shell.xcodeproj \
            -scheme pwa-shell \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ship/build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -40
          echo "the shell compiles"

      - name: Stop here when only compiling
        if: ${{ inputs.compile_only }}
        run: echo "compile_only — nothing signed, nothing uploaded" >> "$GITHUB_STEP_SUMMARY"

      - name: Build number
        id: bn
        if: ${{ !inputs.compile_only }}
        run: |
          BN="${{ inputs.build_number }}"
          [ -n "$BN" ] || BN="${{ github.run_number }}"
          echo "value=$BN" >> "$GITHUB_OUTPUT"
          echo "build number $BN"

      # cert + sigh create the signing assets ON THIS RUNNER from the API key. A fresh keychain
      # keeps them out of the runner's login keychain and away from anything else on the box.
      - name: Signing certificate and provisioning profile
        # NOT on a submit-only run: signing mints a new distribution certificate and, at Apple's
        # cap, frees one — which is how build 15's signing certificate was revoked out from under
        # it (ITMS-90035). A submit needs no binary work at all.
        if: ${{ !inputs.compile_only && !inputs.skip_upload }}
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          # Being the DEFAULT keychain is not the same as being SEARCHED. Without this, cert
          # imports the identity successfully and xcodebuild still reports "no local code signing
          # identities found", because codesign only looks through the search list.
          security list-keychains -d user -s build.keychain login.keychain
          cd ship/fastlane
          fastlane signing build_number:${{ steps.bn.outputs.value }}
          cd "$GITHUB_WORKSPACE"
          # Let codesign use the imported private key without a UI prompt. On a headless runner
          # there is nobody to click "Always Allow", so without this the archive hangs or fails.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain >/dev/null 2>&1 || true
          echo "code signing identities now visible:"
          security find-identity -v -p codesigning
          security find-identity -v -p codesigning | grep -q "Apple Distribution"             || { echo "::error::no Apple Distribution identity in the keychain — the archive would fail"; exit 1; }

      - name: Archive and export the App Store IPA
        if: ${{ !inputs.compile_only && !inputs.skip_upload }}
        run: cd ship/fastlane && fastlane build build_number:${{ steps.bn.outputs.value }}

      - name: What was built
        if: ${{ !inputs.compile_only && !inputs.skip_upload }}
        run: |
          ls -la ship/build/*.ipa
          IPA="$(ls ship/build/*.ipa | head -1)"
          echo "ipa: $IPA ($(du -h "$IPA" | cut -f1))"
          unzip -p "$IPA" 'Payload/*.app/Info.plist' > /tmp/i.plist 2>/dev/null || true
          for k in CFBundleIdentifier CFBundleShortVersionString CFBundleVersion MinimumOSVersion; do
            printf '  %-28s %s\n' "$k" "$(/usr/libexec/PlistBuddy -c "Print :$k" /tmp/i.plist 2>/dev/null || echo '-')"
          done

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.compile_only }}
        with:
          name: scroll-anytime-ipa
          path: |
            ship/build/*.ipa
            ship/build/*.log
          retention-days: 14
          if-no-files-found: warn

      - name: Upload the build to App Store Connect
        if: ${{ !inputs.skip_upload && !inputs.compile_only }}
        run: cd ship/fastlane && fastlane upload build_number:${{ steps.bn.outputs.value }}

      # Screenshots first and on their own: they do not depend on review information, and pushing
      # them separately means a missing contact phone cannot hold the store listing hostage.
      - name: Where this got to
        if: always()
        run: |
          {
            echo "### Scroll Anytime — iOS release"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| build number | ${{ steps.bn.outputs.value }} |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| uploaded | ${{ !inputs.skip_upload }} |"
            echo "| submitted for review | ${{ inputs.submit_for_review && !inputs.skip_upload }} |"
            echo ""
            if [ "${{ inputs.submit_for_review }}" != "true" ]; then
              echo "Not submitted. Re-run with **submit_for_review: true** once OWNER-DEVICE-TEST is complete and triaged."
            fi
            echo ""
            echo "App Store Connect: https://appstoreconnect.apple.com/apps"
          } >> "$GITHUB_STEP_SUMMARY"
